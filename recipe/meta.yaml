{% set name = "qcs-api-client" %}
{% set version = "0.27.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2155ca237bb3e331315f3ad064d91186210dbbc9104269f0b033f8d9c56da101

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry >=1.0
  run:
    - pydantic-core >=2.27.2,<3.0.0
    - qcs-api-client-common >=0.17.5,<0.19.0
    - tenacity >=9.1.4,<10.0.0
    - pydantic-settings >=2.8.1,<3.0.0
    - attrs >=25.4.0,<26.0.0
    - httpx >=0.28.1,<0.29.0
    - iso8601 >=1.0.2,<2.0.0
    - pydantic >=2.10.6,<3.0.0
    - pyjwt >=2.12.1,<3.0.0
    - python >={{ python_min }}
    - python-dateutil >=2.9.0.post0,<3.0.0
    - retrying >=1.3.3,<2.0.0
    - rfc3339 >=6.2,<7.0
    - toml >=0.10.2,<0.11.0

test:
  imports:
    - qcs_api_client
    - qcs_api_client.api
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/rigetti/qcs-api-client-python
  summary: A client library for accessing the Rigetti QCS API
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://qcs-api-client-python.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - BastianZim
