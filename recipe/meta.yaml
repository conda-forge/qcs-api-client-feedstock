{% set name = "qcs-api-client" %}
{% set version = "0.27.7" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 097b71468dfb2bcdd1ee27999fe0e22f9efa5a71dd1be74852ad9f870a705e02

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - uv-build >=0.12.7,<0.13
  run:
    - pydantic-core >=2.27.2,<3.0.0
    - qcs-api-client-common >=0.17.5,<0.19.0
    - tenacity >=9.1.4,<10.0.0
    - pydantic-settings >=2.8.1,<3.0.0
    - attrs >=25.4.0,<26.0.0
    - httpx >=0.28.1,<0.29.0
    - pydantic >=2.10.6,<3.0.0
    - pyjwt >=2.12.1,<3.0.0
    - python >={{ python_min }}
    - python-dateutil >=2.9.0.post0,<3.0.0
    - rfc3339 >=6.2,<7.0
    - toml >=0.10.2,<0.11.0

test:
  imports:
    - qcs_api_client
    - qcs_api_client.api
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/rigetti/qcs-api-client-python
  summary: A client library for accessing the Rigetti QCS API
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://qcs-api-client-python.readthedocs.io/en/latest/index.html

extra:
  recipe-maintainers:
    - BastianZim
